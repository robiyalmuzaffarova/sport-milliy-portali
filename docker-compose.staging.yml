# Staging compose for shared VPS — adapted from docker-compose.production.yml
# Changes vs production (to protect other services on this shared server):
#   - postgres: host port 5432 NOT published (DB stays inside docker network)
#   - rabbitmq: management port 15672 NOT published (internal only)
#   - nginx:   binds 127.0.0.1:8446:80 only (no 80/443 grab — xray owns 443,
#              host-nginx owns 80). Host-nginx reverse-proxies the domain + TLS.
services:
  postgres:
    image: postgres:15-alpine
    container_name: sport-portal-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-sportuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sportpass}
      POSTGRES_DB: sportdb_prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sportuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: sport-portal-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-sportpass} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sportpass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sport-portal-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sportuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sportpass}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sport-portal-backend-prod
    # No host port: the project nginx (below) proxies /api/v1 to this
    # container over the docker network. Frontend is now built, so nginx
    # fronts both frontend and backend on 127.0.0.1:8446.
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sportuser}:${DB_PASSWORD:-sportpass}@postgres:5432/sportdb_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-sportuser}:${RABBITMQ_PASSWORD:-sportpass}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/1
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS}
      FRONTEND_URL: https://sport-milliy-portali.duckdns.org:9444
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - sport-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sport-portal-celery-worker-prod
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sportuser}:${DB_PASSWORD:-sportpass}@postgres:5432/sportdb_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-sportuser}:${RABBITMQ_PASSWORD:-sportpass}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/1
      DEBUG: "False"
      ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - backend
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sport-portal-celery-beat-prod
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql://${DB_USER:-sportuser}:${DB_PASSWORD:-sportpass}@postgres:5432/sportdb_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-sportuser}:${RABBITMQ_PASSWORD:-sportpass}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-sportpass}@redis:6379/1
      DEBUG: "False"
      ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Next.js inlines NEXT_PUBLIC_* into the JS bundle at build time, so
      # they must be passed as build args, not just container `environment:`.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sport-milliy-portali.duckdns.org/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sport-milliy-portali.duckdns.org}
    container_name: sport-portal-frontend-prod
    # Kept for any server-side code that reads these at request time (SSR).
    # The values that matter for the client bundle come from build.args above.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sport-milliy-portali.duckdns.org/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://sport-milliy-portali.duckdns.org}
      NODE_ENV: production
    networks:
      - sport-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:alpine
    container_name: sport-portal-nginx-prod
    ports:
      - "127.0.0.1:8446:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - sport-network-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  rabbitmq_data_prod:
    driver: local
  backend_uploads:
    driver: local
  nginx_logs:
    driver: local

networks:
  sport-network-prod:
    driver: bridge
